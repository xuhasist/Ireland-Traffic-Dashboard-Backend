services:
  postgres:
    image: postgres:16
    container_name: ireland-traffic-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: traffic_dashboard
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      TZ: Asia/Taipei
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d traffic_dashboard"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: